<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #D5F4FF;
        }

        main {
            display: grid;
            grid-template-columns: 0 1fr;
            text-align: center;
        }

        main.show {
            grid-template-columns: 3fr 13fr;
        }

        aside {
            height: 83vh;
            padding-block: 1vh;
            overflow: hidden;
            background-color: white;
        }

        form {
            margin: 0 2vh 2vh;
        }

        input {
            text-align: center;
            width: 80%;
            height: 5vh;
            margin: 1vh 1vw;
        }

        .students {
            height: 60%;
            margin: 1vh 0;
            padding: 1vh 0;
            border-block: 1px solid black;
            list-style: none;
            overflow-y: auto;
        }

        .students li {
            padding: 1vh 0;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            margin: 10vh 2vw;
        }

        .seat {
            display: grid;
            place-items: center;
            height: 10vh;
            border: 1px solid black;
            background-color: white;
            user-select: none;
        }

        .hamburger span {
            display: block;
            width: 30px;
            height: 3px;
            margin: 6px 0;
            background: black;
        }


        /* ボタンの状態 */
        li button:disabled {
            border: none;
            color: inherit;
            background-color: transparent;
        }

        .hidden,
        .count {
            display: none;
        }

        .count.show {
            display: block;
        }

        .selected {
            background-color: lightgreen;
        }

        /* 席の状態 */
        .disabled {
            background-color: gray;
        }

        .ladies {
            background-color: #FCE1E1;
        }

        @media screen and (max-width: 450px) and (orientation: portrait) {
            body {
                margin: 0;
            }

            main {
                grid-template-columns: 1fr;
            }

            main.show {
                grid-template-columns: 1fr;
            }

            aside {
                position: absolute;
                top: -100%;
                width: 100%;
            }

            main.show aside {
                top: 40px;
            }

            form {
                max-width: 400px;
                margin-inline: auto;
            }

            input {
                width: auto;
                height: auto;
            }

            select[name="gender"] {
                display: block;
                margin-inline: auto;
            }

            .count.show {
                display: none;
            }

            .seat {
                writing-mode: vertical-lr;
            }

            button[type="submit"] {
                display: inline-block;
            }
        }

        @media screen and (max-height: 450px) and (orientation: landscape) {
            body {
                margin: 0;
            }

            main {
                grid-template-columns: 1fr;
            }

            main.show {
                grid-template-columns: 1fr;
            }

            aside {
                position: absolute;
                top: -100%;
                width: 100%;
            }

            main.show aside {
                top: 40px;
            }

            form {
                display: grid;
                grid-template-columns: auto 1fr auto;
                max-width: 400px;
                margin-inline: auto;
            }

            input {
                width: auto;
            }

            .count.show {
                display: none;
            }

            button[type="submit"] {
                display: inline-block;
            }
        }
    </style>
</head>

<body>
    <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <main class="show">
        <aside>
            <form>
                <select name="gender" required>
                    <option value="">――</option>
                    <option value="male">男性</option>
                    <option value="female">女性</option>
                </select>
                <input type="text" name="name">
                <button type="submit" hidden>追加</button>
            </form>

            <button data-mode="front">前列優先</button>
            <button data-mode="back">後列優先</button>
            <button class="confirm hidden">確定</button>
            <button class="cancel hidden">キャンセル</button>

            <ul class="students">
            </ul>

            <button data-mode="remove">削除</button>
        </aside>

        <section id="LaLa901">
            <!-- 前の席 -->
            <div class="row">
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
            </div>

            <!-- 真ん中の席 -->
            <div class="row">
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
            </div>

            <!-- 後ろの席 -->
            <div class="row">
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>

                <div class="aisle"></div>

                <div class="seat"></div>
                <div class="seat"></div>
            </div>

            <div>
                <button type="button" class="reset">動作テスト用ボタン(押すと初期化されます)</button><br>
                <button type="button" class="shuffle">席替え</button>
            </div>
        </section>
    </main>

    <div class="count show">
        男性:<span class="maleCount"></span>名
        　女性:<span class="femaleCount"></span>名
        　合計:<span class="totalCount"></span>名
    </div>

    <script src="Seat.js"></script>
    <script src="Student.js"></script>
    <script src="List.js"></script>

    <script>
        let List = load("List");
        countStudents();

        const menuBtn = document.querySelector(".hamburger");
        const elements = document.querySelectorAll("main, .count");
        menuBtn.addEventListener("click", () => {
            elements.forEach(element => {
                element.classList.toggle("show");
            })
        })

        const cancelBtn = document.querySelector(".cancel");
        const confirmBtn = document.querySelector(".confirm");
        const otherButtons = document.querySelectorAll("button:not(.hamburger)");
        const modeButtons = document.querySelectorAll("[data-mode]");
        let mode = null;

        modeButtons.forEach(modeButton => {
            modeButton.addEventListener("click", () => {
                mode = modeButton.dataset.mode;
                otherButtons.forEach(button => {
                    button.classList.toggle("hidden");
                })
                const nameButtons = document.querySelectorAll("li button");
                nameButtons.forEach((button) => {
                    button.disabled = false;
                    button.addEventListener("click", () => {
                        button.classList.toggle("selected");
                    })
                })
                List.forEach((student, index) => {
                    if (student.priority === mode) {
                        nameButtons[index].classList.add("selected");
                    }
                })
            })
        })

        cancelBtn.addEventListener("click", () => {
            otherButtons.forEach(button => {
                button.classList.toggle("hidden");
            })
            displayStudents();
        })

        confirmBtn.addEventListener("click", () => {
            const selectedIndexes = [];
            selectStudents(selectedIndexes);

            switch (mode) {
                case "front":
                    setPriority(selectedIndexes, mode);
                    break;
                case "back":
                    setPriority(selectedIndexes, mode);
                    break;
                case "remove":
                    removeStudents(selectedIndexes);
                    countStudents();
                    break;
            }

            save(List, "List");
            displayStudents();
            otherButtons.forEach(button => {
                button.classList.toggle("hidden");
            })
        })

        const ul = document.querySelector(".students");

        const text = document.querySelector('input[name="name"]');
        const form = document.querySelector("form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            addName();
            displayStudents();
        })

        document.querySelector(".reset").addEventListener("click", () => {
            localStorage.clear();
            location.reload();
        })

        const sekigae = document.querySelector(".shuffle");
        sekigae.addEventListener("click", () => {
            seats.forEach(seat => {
                seat.vacate();
            })

            const ableSeats = seats.filter(seat => {
                return seat.status === null;
            })

            if (List.length > ableSeats.length) {
                alert("人数が多すぎます");
                return;
            }

            // const frontLadiesSeats = ableSeats.filter(seat => {
            //     return (seat.row === 0 && seat.type === "ladies");
            // });
            // shuffle(frontLadiesSeats);
            // let i = 0;
            // List.forEach(student => {
            //     if ((student.priority === "front" && student.gender === "female")) {
            //         frontLadiesSeats[i].occupy(student);
            //         i++;
            //     }
            // })

            // const frontSeats = ableSeats.filter(seat => {
            //     return (seat.row === 0 && seat.status === null);
            // })
            // shuffle(frontSeats);
            // let j = 0;
            // List.forEach(student => {
            //     if ((student.priority === "front" && student.gender === "male")) {
            //         frontSeats[j].occupy(student);
            //         j++;
            //     }
            // })

            const frontSeat = ableSeats.filter(seat => {
                return seat.row === 0;
            });
            shuffle(frontSeat);
            let i = 0;
            List.forEach(student => {
                if (student.priority === "front") {
                    frontSeat[i].occupy(student);
                    i++;
                }
            })

            const backSeat = ableSeats.filter(seat => {
                return seat.row === 2;
            });
            shuffle(backSeat);
            let k = 0;
            List.forEach(student => {
                if (student.priority === "back") {
                    backSeat[k].occupy(student);
                    k++;
                }
            })

            let freeSeats = [];

            seats.forEach(Seat => {
                if (Seat.status == null) {
                    freeSeats.push(Seat);
                }
            });

            shuffle(freeSeats);
            let m = 0;
            List.forEach((student) => {
                if (student.priority === null) {
                    freeSeats[m].occupy(student);
                    m++;
                }
            })
        })

        const seats = [];

        document.querySelectorAll(".row")
            .forEach((rowElement, row) => {
                rowElement.querySelectorAll(".seat")
                    .forEach(seatElement => {
                        const seat = new Seat(seatElement, row)
                        seats.push(seat);
                        seatElement.addEventListener("click", () => {
                            seat.changeType();
                        })
                    })
            })


        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        displayStudents();
    </script>
</body>

</html>
